name: Continuous Integration

on:
  push:
    branches:
    - master
    - v2

  pull_request:
    branches:
    - master
    - v2

env:
  # Must equal vcpkg.json's "builtin-baseline". When they disagree, vcpkg is
  # checked out at a commit whose version database lacks the manifest's versions:
  # "error: no version database entry for catch2 at 3.15.0".
  VCPKG_COMMIT: "059d760472984042e1b4db0d40efd935a1adcbc9"

jobs:
  lint:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install codespell
      run: pip3 install codespell

    - name: Lint
      run: cmake -D FORMAT_COMMAND=clang-format-14 -P cmake/lint.cmake

    - name: Spell check
      if: always()
      run: cmake -P cmake/spell.cmake

  coverage:
    needs: [lint]

    runs-on: ubuntu-22.04

    # To enable coverage, delete the last line from the conditional below and
    # edit the "<name>" placeholder to your GitHub name.
    # If you do not wish to use codecov, then simply delete this job from the
    # workflow.
    if: github.repository_owner == '<name>'
      && false

    steps:
    - uses: actions/checkout@v4

    - name: Install LCov
      run: sudo apt-get update -q
        && sudo apt-get install lcov -q -y

    - name: Install vcpkg
      uses: friendlyanon/setup-vcpkg@v1
      with: { committish: "${{ env.VCPKG_COMMIT }}" }

    - name: Configure
      run: cmake --preset=ci-coverage

    - name: Build
      run: cmake --build build/coverage -j 2

    - name: Test
      working-directory: build/coverage
      run: ctest --output-on-failure --no-tests=error -j 2

    - name: Process coverage info
      run: cmake --build build/coverage -t coverage

    - name: Submit to codecov.io
      uses: codecov/codecov-action@v4
      with:
        file: build/coverage/coverage.info
        token: ${{ secrets.CODECOV_TOKEN }}

  # The Linux test/sanitize jobs run inside a container that genuinely carries
  # GStreamer >= 1.28 (the floor declared in CMakeLists.txt). The default
  # ubuntu-22.04 runner ships GStreamer 1.20 and fails at Configure, and no job
  # installs GStreamer. Fedora 44 is a released distro whose packages include
  # GStreamer 1.28.7; `pkg-config --modversion gstreamer-1.0` reports 1.28.7 in
  # fedora:44. Everything else the tree needs (FLTK's X11/fontconfig headers,
  # rist-cpp's meson/librist, clang + compiler-rt for the sanitiser runtime) is
  # installed explicitly below. The vcpkg cache key folds in the image name
  # because these jobs share runner.os "Linux" with the old ubuntu jobs but run
  # a different ABI.

  sanitize:
    needs: [lint]

    runs-on: ubuntu-latest
    container: fedora:44

    env: { CXX: clang++ }

    steps:
    # git is required by actions/checkout before any other step can run.
    - name: Install git for checkout
      run: dnf install -y git

    - uses: actions/checkout@v4
      with: { submodules: recursive }

    - name: Install build dependencies
      run: >-
        dnf install -y
        gcc gcc-c++ clang compiler-rt cmake ninja-build pkgconf-pkg-config make
        gstreamer1-devel gstreamer1-plugins-base-devel
        libX11-devel libXcursor-devel libXfixes-devel libXinerama-devel
        libXft-devel fontconfig-devel libXrender-devel mesa-libGL-devel
        meson curl zip unzip tar which findutils

    - name: Install vcpkg
      uses: friendlyanon/setup-vcpkg@v1
      with:
        committish: "${{ env.VCPKG_COMMIT }}"
        cache-version: fedora44-sanitize

    - name: Configure
      run: cmake --preset=ci-sanitize

    - name: Build
      run: cmake --build build/sanitize -j 2

    - name: Test
      working-directory: build/sanitize
      env:
        ASAN_OPTIONS: "strict_string_checks=1:\
          detect_stack_use_after_return=1:\
          check_initialization_order=1:\
          strict_init_order=1:\
          detect_leaks=1:\
          halt_on_error=1"
        UBSAN_OPTIONS: "print_stacktrace=1:\
          halt_on_error=1"
      run: ctest --output-on-failure --no-tests=error -j 2

  # Linux entry of the build matrix, moved off the GStreamer-1.20 ubuntu runner
  # onto the same GStreamer-1.28-capable container as `sanitize`. macOS and
  # Windows cannot use a Linux container job, so they stay as runner-based
  # matrix entries below.
  test-linux:
    needs: [lint]

    runs-on: ubuntu-latest
    container: fedora:44

    steps:
    - name: Install git for checkout
      run: dnf install -y git

    - uses: actions/checkout@v4
      with: { submodules: recursive }

    - name: Install build dependencies
      run: >-
        dnf install -y
        gcc gcc-c++ clang clang-tools-extra cppcheck cmake ninja-build
        pkgconf-pkg-config make
        gstreamer1-devel gstreamer1-plugins-base-devel
        libX11-devel libXcursor-devel libXfixes-devel libXinerama-devel
        libXft-devel fontconfig-devel libXrender-devel mesa-libGL-devel
        meson curl zip unzip tar which findutils

    - name: Install vcpkg
      uses: friendlyanon/setup-vcpkg@v1
      with:
        committish: "${{ env.VCPKG_COMMIT }}"
        cache-version: fedora44-testlinux

    - name: Configure
      run: cmake --preset=ci-ubuntu

    - name: Build
      run: cmake --build build --config Release -j 2

    - name: Install
      run: cmake --install build --config Release --prefix prefix

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2

  test:
    needs: [lint]

    strategy:
      # Report each platform's real result instead of cancelling the others.
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
      with: { submodules: recursive }

    - name: Install vcpkg
      uses: friendlyanon/setup-vcpkg@v1
      with: { committish: "${{ env.VCPKG_COMMIT }}" }

    - name: Setup MultiToolTask
      if: matrix.os == 'windows-2022'
      run: |
        Add-Content "$env:GITHUB_ENV" 'UseMultiToolTask=true'
        Add-Content "$env:GITHUB_ENV" 'EnforceProcessCountAcrossBuilds=true'

    - name: Configure
      shell: pwsh
      run: cmake "--preset=ci-$("${{ matrix.os }}".split("-")[0])"

    - name: Build
      run: cmake --build build --config Release -j 2

    - name: Install
      run: cmake --install build --config Release --prefix prefix

    - name: Test
      working-directory: build
      run: ctest --output-on-failure --no-tests=error -C Release -j 2

  docs:
    # Deploy docs only when builds succeed
    needs: [sanitize, test]

    runs-on: ubuntu-22.04

    # To enable, first you have to create an orphaned gh-pages branch:
    #
    #    git switch --orphan gh-pages
    #    git commit --allow-empty -m "Initial commit"
    #    git push -u origin gh-pages
    #
    # Edit the <name> placeholder below to your GitHub name, so this action
    # runs only in your repository and no one else's fork. After these, delete
    # this comment and the last line in the conditional below.
    # If you do not wish to use GitHub Pages for deploying documentation, then
    # simply delete this job similarly to the coverage one.
    if: github.ref == 'refs/heads/master'
      && github.event_name == 'push'
      && github.repository_owner == '<name>'
      && false

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }

    - name: Install m.css dependencies
      run: pip3 install jinja2 Pygments

    - name: Install Doxygen
      run: sudo apt-get update -q
        && sudo apt-get install doxygen -q -y

    - name: Build docs
      run: cmake "-DPROJECT_SOURCE_DIR=$PWD" "-DPROJECT_BINARY_DIR=$PWD/build"
        -P cmake/docs-ci.cmake

    - name: Deploy docs
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/docs/html
